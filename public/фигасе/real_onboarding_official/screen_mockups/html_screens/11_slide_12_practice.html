<!DOCTYPE html>

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: #111019;
    color: #ffffff;
    width: 430px;
    height: 932px;
    display: flex;
    flex-direction: column;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .status-bar { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-bottom: 20px; z-index: 10; }
  .header { text-align: center; margin-bottom: 20px; z-index: 10; }
  .badge { color: #FF7A45; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #9E9DAE; line-height: 1.4; }
  .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 5; }
  .video-box { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; display: flex; }
  video { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
  .opt-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .opt-card { background: #1C1B29; border: 1px solid #2B293E; border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
  .text-col { display: flex; flex-direction: column; }
  .opt-title { font-size: 16px; font-weight: 600; }
  .opt-sub { font-size: 12px; color: #FF7A45; font-weight: 600; margin-top: 2px; }
  .btn-bottom { background: linear-gradient(90deg, #FF7A45 0%, #FF5722 100%); color: #fff; font-size: 17px; font-weight: 700; text-align: center; padding: 18px; border-radius: 20px; margin-top: auto; z-index: 10; box-shadow: 0 8px 24px rgba(255,122,69,0.3); }
</style>
</head>
