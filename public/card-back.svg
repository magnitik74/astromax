<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17181C"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#14161B"/>
    </linearGradient>

    <!-- MAX Electric Blue & Silver Linework Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#529EF4"/>
      <stop offset="45%" stop-color="#007AFF"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#0056B3"/>
    </linearGradient>

    <!-- Subtle Blue Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 122, 255, 0.22)"/>
      <stop offset="60%" stop-color="rgba(0, 122, 255, 0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Card Base -->
  <rect x="4" y="4" width="292" height="472" rx="14" fill="url(#bgGrad)" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <rect x="5" y="5" width="290" height="470" rx="13" fill="url(#centerGlow)"/>

  <!-- Native Minimalist Frame -->
  <rect x="14" y="14" width="272" height="452" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="20" y="20" width="260" height="440" rx="8" fill="none" stroke="url(#lineGrad)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Sacred Geometry / Celestial Sphere in Blue & Silver -->
  <circle cx="150" cy="240" r="70" fill="none" stroke="url(#lineGrad)" stroke-width="1.2"/>
  <circle cx="150" cy="240" r="54" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.8"/>
  <ellipse cx="150" cy="240" rx="70" ry="24" fill="none" stroke="url(#lineGrad)" stroke-width="1" transform="rotate(-28 150 240)"/>
  <ellipse cx="150" cy="240" rx="70" ry="24" fill="none" stroke="url(#lineGrad)" stroke-width="1" transform="rotate(28 150 240)"/>

  <!-- Star Nodes -->
  <circle cx="150" cy="240" r="3.5" fill="#529EF4"/>
  <path d="M 150 160 L 150 320 M 70 240 L 230 240" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8"/>

  <!-- Corner Minimal Badges -->
  <circle cx="28" cy="28" r="2.5" fill="#007AFF"/>
  <circle cx="272" cy="28" r="2.5" fill="#007AFF"/>
  <circle cx="28" cy="452" r="2.5" fill="#007AFF"/>
  <circle cx="272" cy="452" r="2.5" fill="#007AFF"/>
</svg>
