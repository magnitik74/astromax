<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="100%" height="100%">
  <defs>
    <linearGradient id="frontBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17181C"/>
      <stop offset="50%" stop-color="#101115"/>
      <stop offset="100%" stop-color="#14161C"/>
    </linearGradient>
    <linearGradient id="frontBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#529EF4"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#363738"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect x="4" y="4" width="292" height="472" rx="14" fill="url(#frontBg)" stroke="url(#frontBorder)" stroke-width="1.5"/>

  <!-- Border & Frames -->
  <rect x="14" y="14" width="272" height="452" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="20" y="20" width="260" height="440" rx="8" fill="none" stroke="rgba(0, 122, 255, 0.35)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Title Frame -->
  <path d="M 40 48 Q 150 36 260 48" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
  <!-- Bottom Plate -->
  <path d="M 40 432 Q 150 444 260 432" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>

  <!-- Minimal Corner Dots -->
  <circle cx="28" cy="28" r="2.5" fill="#007AFF"/>
  <circle cx="272" cy="28" r="2.5" fill="#007AFF"/>
  <circle cx="28" cy="452" r="2.5" fill="#007AFF"/>
  <circle cx="272" cy="452" r="2.5" fill="#007AFF"/>
</svg>
