<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Cosmic Obsidian to Deep Midnight Indigo) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121630"/>
      <stop offset="60%" stop-color="#090B14"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- MAX Signature Neon Gradient: Electric Cyan -> Cobalt Blue -> Royal Ultraviolet -->
    <linearGradient id="neonMaxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="35%" stop-color="#0A66FF"/>
      <stop offset="75%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#A800FF"/>
    </linearGradient>

    <!-- Hot Luminous Core (White-Cyan for high contrast at 32px) -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D0F8FF"/>
      <stop offset="100%" stop-color="#79B5FF"/>
    </linearGradient>

    <!-- Orbital Cyan Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#0A66FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="3" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Burst Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0A66FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="260" r="140" fill="#0A66FF" opacity="0.12" filter="blur(40px)"/>
  <circle cx="256" cy="140" r="80" fill="#00F5FF" opacity="0.15" filter="blur(30px)"/>

  <!-- ==================== THE LETTER "A" ==================== -->
  <g filter="url(#neonGlow)">
    <!-- Base Outer Neon Bloom (Thick Silhouette) -->
    <path d="M 256 108 L 136 384 L 184 384 L 216 308 L 296 308 L 328 384 L 376 384 Z M 256 206 L 280 268 L 232 268 Z" 
          fill="none" 
          stroke="url(#neonMaxGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"
          opacity="0.8"/>

    <!-- Sharp Solid Geometric Glyph "A" with Glassmorphic Cutouts -->
    <path d="M 256 116 L 146 376 L 190 376 L 220 304 L 292 304 L 322 376 L 366 376 Z M 256 216 L 278 270 L 234 270 Z" 
          fill="url(#neonMaxGrad)"/>

    <!-- Inner Luminous Highlight Spine (Gives 3D depth and readability) -->
    <path d="M 256 122 L 170 340 M 256 122 L 342 340" 
          stroke="url(#coreGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.95"/>
  </g>

  <!-- ==================== CELESTIAL ORBIT CROSSBAR ==================== -->
  <!-- Elliptical planetary orbit replacing / fusing with the crossbar -->
  <g filter="url(#neonGlow)">
    <!-- Behind / Crossing the letter -->
    <ellipse cx="256" cy="304" rx="145" ry="34" 
             transform="rotate(-10 256 304)"
             fill="none" 
             stroke="url(#orbitGrad)" 
             stroke-width="5" 
             stroke-dasharray="240 15 60 15"/>
    
    <!-- Orbit Bright Nodes (Planetary Energy Points) -->
    <circle cx="120" cy="328" r="4.5" fill="#00F5FF"/>
    <circle cx="390" cy="278" r="3.5" fill="#A800FF"/>
  </g>

  <!-- ==================== APEX POLAR STAR BURST ==================== -->
  <!-- Cosmic Star at the Top Vertex of A -->
  <g transform="translate(256, 116)">
    <!-- Ambient Star Halo -->
    <circle cx="0" cy="0" r="42" fill="url(#starGlow)"/>

    <!-- 4-Point Diamond Rays -->
    <!-- Vertical Ray -->
    <path d="M 0 -36 Q 0 0 6 0 Q 0 0 0 36 Q 0 0 -6 0 Q 0 0 0 -36 Z" fill="#FFFFFF"/>
    <!-- Horizontal Ray -->
    <path d="M -36 0 Q 0 0 0 6 Q 0 0 36 0 Q 0 0 0 -6 Q 0 0 -36 0 Z" fill="#FFFFFF"/>
    
    <!-- Diagonal Subtle Glint -->
    <path d="M -16 -16 Q 0 0 0 2 Q 0 0 16 16 Q 0 0 0 -2 Z" fill="#00F5FF" opacity="0.8"/>
    <path d="M 16 -16 Q 0 0 2 0 Q 0 0 -16 16 Q 0 0 -2 0 Z" fill="#00F5FF" opacity="0.8"/>

    <!-- Bright Core Sparkle -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Micro-Constellation Stars in the Field (Subtle Depth) -->
  <circle cx="110" cy="140" r="1.5" fill="#00F5FF" opacity="0.6"/>
  <circle cx="400" cy="170" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="380" cy="410" r="1.5" fill="#7000FF" opacity="0.6"/>
  <circle cx="130" cy="420" r="1.5" fill="#00F5FF" opacity="0.5"/>
</svg>
